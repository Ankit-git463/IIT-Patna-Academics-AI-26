{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<h2>Edit Student: {{ student.roll }}</h2>
<div style="margin-bottom: 20px;">
    <a href="{{ url_for('view_students') }}" class="btn-primary">Back to List</a>
</div>

<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ student.name }}" required>
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" value="{{ student.age }}" required>
        </div>

        <div class="form-group">
            <label>Branch</label>
            <input type="text" name="branch" value="{{ student.branch }}" required>
        </div>

        <div class="form-group">
            <label>Hometown</label>
            <input type="text" name="hometown" value="{{ student.hometown }}" required>
        </div>

        <button type="submit" class="btn-primary">Update Student</button>
    </form>
</div>
{% endblock %}
